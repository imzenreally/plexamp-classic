<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src http: https:; font-src 'self' data:;" />
<title>Winamp Media Library</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0a0a0c; color: #d8d8e0;
    font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden; height: 100vh; display: flex; flex-direction: column;
  }
  #topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 34px 12px 8px 96px; /* 96px clears the traffic lights */
    background: #16161c; border-bottom: 1px solid #26262e;
    -webkit-app-region: drag; flex: 0 0 auto;
  }
  #topbar b { color: #9fd6ff; font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  #topbar .spacer { flex: 1; }
  #server {
    -webkit-app-region: no-drag; background:#1d1d26; color:#9fd6ff;
    border:1px solid #2e2e3a; border-radius:4px; padding:3px 6px; font-size:12px;
    max-width: 320px; min-width: 0; flex: 0 1 auto;
  }
  #loginbar { display: flex; align-items: center; gap: 10px; -webkit-app-region: no-drag; font-size: 12px; color: #8a8a98; }
  #loginbar button {
    background:#213546; color:#9fd6ff; border:1px solid #3d6a8c; border-radius:4px;
    padding:3px 10px; font-size:12px; cursor:pointer;
  }
  #changeserver, #loginbar button {
  -webkit-app-region: no-drag; background:#213546; color:#9fd6ff; border:1px solid #3d6a8c;
  border-radius:4px; padding:3px 10px; font-size:12px; cursor:pointer; white-space: nowrap;
}
#changeserver:hover, #loginbar button:hover { background:#2a4258; }
  #servers { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; }
  .servercard {
    background: #14141a; border: 1px solid #22222c; border-radius: 6px;
    padding: 14px; width: 240px; cursor: pointer; transition: border-color 0.12s;
  }
  .servercard:hover { border-color: #3d6a8c; }
  .servercard .t { font-weight: 600; color: #dfe3ea; font-size: 13px; margin-bottom: 4px; }
  .servercard .y { color: #6a6a78; font-size: 11px; }
  #library { display: none; flex: 1; min-height: 0; }
  #sidebar {
    width: 260px; background: #101014; border-right: 1px solid #1e1e26;
    display: flex; flex-direction: column;
  }
  #search {
    -webkit-app-region: no-drag; margin: 8px; padding: 6px 8px; background: #1a1a22;
    border: 1px solid #2a2a36; color: #d8d8e0; border-radius: 4px; outline: none; font-size: 12px;
  }
  #search:focus { border-color: #3d6a8c; }
  #artists { overflow-y: auto; flex: 1; padding: 0 4px 8px; }
  .artist {
    padding: 5px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; color: #b8b8c2;
  }
  .artist.active { background: #213546; color: #9fd6ff; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #albums {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px; padding: 12px; overflow-y: auto; flex: 1; align-content: start;
  }
  .artist:hover { background: #1c1c26; color: #e6e6ee; }
  .album {
    background: #14141a; border: 1px solid #22222c; border-radius: 6px;
    padding: 10px; cursor: pointer; transition: border-color 0.12s;
    overflow: hidden; min-width: 0;
  }
  .album .t, .album .y, .album .hint {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .album:hover { border-color: #3d6a8c; }
  .album.active { border-color: #9fd6ff; }
  .album .t { font-weight: 600; color: #dfe3ea; font-size: 12px; margin-bottom: 2px; }
  .album .y { color: #6a6a78; font-size: 11px; }
  .album .hint { color: #3f5a72; font-size: 10px; margin-top: 6px; }
  #status {
    padding: 4px 12px; color: #565664; font-size: 11px; flex: 0 0 auto;
    border-top: 1px solid #1a1a22;
  }
  .empty { color: #4a4a58; padding: 24px; }
</style>
</head>
<body>
  <div id="topbar">
    <b>MEDIA LIBRARY</b>
    <select id="server" style="display:none"></select>
    <span class="spacer"></span>
    <button id="changeserver" style="display:none">Change Server</button>
    <div id="loginbar"><span>Checking Plex auth…</span></div>
  </div>
  <div id="servers"></div>
  <div id="library">
    <div id="sidebar">
      <input id="search" placeholder="Filter artists…" />
      <div id="artists"></div>
    </div>
    <div id="main">
      <div id="albums" class="empty">Select an artist.</div>
      <div id="status">Booting…</div>
    </div>
  </div>
<script src="library.js"></script>
</body>
</html>
