<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src http: https:; font-src 'self' data:;" />
<title>Winamp Media Library</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-width: 760px; height: 100vh; overflow: hidden;
    background: #080a0c; color: #d2d8d1;
    font: 12px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    display: flex; flex-direction: column;
  }
  button, input, select { font: inherit; }
  button { -webkit-app-region: no-drag; }
  .chrome {
    background: linear-gradient(#343a3e, #1c2024 46%, #101316 52%, #1f2428);
    border: 1px solid #596168; border-bottom-color: #050607;
    box-shadow: inset 0 1px #899196, inset 0 -1px #34393d;
  }
  #topbar {
    min-height: 66px; padding: 31px 12px 8px 96px; gap: 9px;
    display: flex; align-items: center; -webkit-app-region: drag; flex: 0 0 auto;
  }
  .brand { color: #b5e8c2; letter-spacing: 1.5px; font-size: 11px; font-weight: 800; white-space: nowrap; text-shadow: 0 1px #000; }
  .brand::before { content: "▸"; color: #f2c75c; margin-right: 5px; }
  .spacer { flex: 1; }
  #server, .metal-button, #loginbar button {
    -webkit-app-region: no-drag; min-width: 0; color: #d7ded8;
    background: linear-gradient(#3c444a, #1b2024); border: 1px solid #69747a;
    border-bottom-color: #050607; box-shadow: inset 0 1px #a8b0b3, inset 0 -1px #111417;
    border-radius: 2px; padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  #server { color: #b5e8c2; max-width: 330px; }
  .metal-button:hover, #loginbar button:hover { color: #e9ffe6; border-color: #91a5ae; background: linear-gradient(#4b5860, #222a30); }
  .metal-button:focus-visible, #loginbar button:focus-visible, #server:focus-visible, .entry:focus-visible, #search:focus-visible { outline: 2px solid #73b9e9; outline-offset: 1px; }
  #loginbar { display: flex; align-items: center; gap: 8px; color: #a5aca8; white-space: nowrap; -webkit-app-region: no-drag; }
  #servers { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .servercard { width: 250px; padding: 12px; cursor: pointer; }
  .servercard:hover { border-color: #86b9d2; }
  .servercard .t { color: #ddecdf; font-weight: 700; margin-bottom: 4px; }
  .servercard .y { color: #94a39b; font-size: 11px; }
  #library { display: none; flex: 1; min-height: 0; border-left: 1px solid #394146; border-right: 1px solid #394146; }
  #sidebar { width: 265px; min-width: 205px; background: #0d1112; border-right: 1px solid #3d464b; display: flex; flex-direction: column; }
  .panel-label { padding: 7px 9px 5px; color: #9bcfac; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-shadow: 0 1px #000; }
  .inset { background: #050707; border: 1px solid #303a37; border-top-color: #010101; box-shadow: inset 0 1px 2px #000; }
  #search-row { display: flex; gap: 5px; padding: 0 8px 8px; }
  #search { flex: 1; min-width: 0; padding: 7px 8px; color: #baf4c7; background: #07100a; border: 1px solid #486752; border-radius: 1px; outline: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #search::placeholder { color: #68806d; }
  #clear-search { width: 25px; padding: 0; color: #b7c7bb; }
  #artists { overflow-y: auto; flex: 1; padding: 3px 5px 7px; }
  .artist { display: block; width: 100%; padding: 5px 7px; border: 0; border-left: 2px solid transparent; border-radius: 0; background: transparent; color: #c2cbc4; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .artist:hover { background: #18241d; color: #ecfff0; }
  .artist.active { border-left-color: #80bde7; background: #1a333e; color: #c8edff; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #0a0d0e; }
  #viewbar { display: flex; align-items: center; gap: 8px; min-height: 35px; padding: 5px 10px; border-bottom: 1px solid #384247; background: linear-gradient(#252b2e, #101416); }
  #view-title { color: #d8f7dc; font-size: 11px; letter-spacing: 1.1px; font-weight: 800; text-shadow: 0 1px #000; }
  #view-meta { color: #8fa195; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #content { overflow-y: auto; flex: 1; padding: 11px; display: flex; flex-direction: column; }
  .hint { color: #819187; padding: 18px 8px; }
  .section { margin-bottom: 14px; flex: 0 0 auto; }
  .section-head { display: flex; align-items: baseline; gap: 7px; padding: 0 1px 5px; color: #a8dfb4; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
  .section-count { color: #74857a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 400; }
  .entry-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 6px; }
  .search-tree { max-width: 900px; display: flex; flex-direction: column; gap: 2px; }
  .tree-row { display: flex; align-items: center; min-width: 0; min-height: 31px; padding: 4px 8px; color: #cbd5ce; background: #0d1213; border: 1px solid transparent; border-left-color: #283638; cursor: pointer; text-align: left; }
  .tree-row:hover { color: #f0fff2; background: #18231f; border-color: #486457; }
  .tree-row:focus-visible { outline: 2px solid #73b9e9; outline-offset: -2px; z-index: 1; }
  .tree-row.tree-root { color: #bcecc6; font-weight: 750; background: linear-gradient(90deg, #18251f, #101516); border-left-color: #8cca9d; }
  .tree-row.tree-other { color: #e7c86c; border-left-color: #e7bd4e; }
  .tree-row.tree-category { color: #a7d7ef; border-left-color: #7baeca; }
  .tree-row.tree-album { border-left-color: #679dbc; }
  .tree-row.tree-track { border-left-color: #c9984d; }
  .tree-twist { flex: 0 0 18px; color: #8ba496; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tree-main { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-title { font-weight: inherit; }
  .tree-meta { margin-left: 9px; color: #84958b; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  .entry { position: relative; display: block; min-width: 0; width: 100%; min-height: 56px; padding: 8px 9px 8px 14px; cursor: pointer; text-align: left; color: #d2d8d1; border: 1px solid #4a5559; border-top-color: #687277; border-bottom-color: #111416; border-radius: 1px; background: linear-gradient(135deg, #283034, #151a1c 58%, #101416); box-shadow: inset 0 1px #50595c; }
  .entry::before { content: attr(data-kind); position: absolute; left: 0; top: 0; bottom: 0; display: flex; align-items: center; width: 11px; color: #101715; background: #91d3a1; font-size: 8px; font-weight: 900; writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .5px; }
  .entry.album::before { background: #8cc5e7; }
  .entry.track::before { background: #f2c75c; }
  .entry:hover { border-color: #8dbbd2; color: #f2fff3; background: linear-gradient(135deg, #36454b, #1a2428 58%, #111719); }
  .entry.active { border-color: #c2ecff; box-shadow: inset 0 0 0 1px #559ac1; }
  .entry-title, .entry-sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-title { font-weight: 750; }
  .entry-sub { margin-top: 3px; color: #9ca99f; font-size: 11px; }
  .search-guide { margin-top: auto; padding: 8px 10px; display: flex; gap: 14px; flex-wrap: wrap; color: #91a399; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .search-guide b { color: #e7bd4e; letter-spacing: .5px; }
  .search-guide span { white-space: nowrap; }
  .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; align-content: start; }
  .album { min-height: 83px; }
  .album .entry-sub:last-child { color: #7ea187; font-size: 10px; letter-spacing: .3px; }
  #status { min-height: 26px; padding: 5px 10px; border-top: 1px solid #485156; color: #9db8a3; background: #101516; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status::before { content: "STATUS"; color: #e7bd4e; margin-right: 8px; font-weight: 800; letter-spacing: .6px; }
  .empty { color: #839188; padding: 24px 8px; }
  @media (max-width: 820px) { #sidebar { width: 215px; } #topbar { padding-left: 86px; } #loginbar > span { display: none; } }
</style>
</head>
<body>
  <div id="topbar" class="chrome">
    <span class="brand">MEDIA LIBRARY</span>
    <select id="server" style="display:none"></select>
    <span class="spacer"></span>
    <button id="changeserver" class="metal-button" style="display:none">Change Server</button>
    <div id="loginbar"><span>Checking Plex auth…</span></div>
  </div>
  <div id="servers"></div>
  <div id="library">
    <aside id="sidebar">
      <div class="panel-label">SEARCH PLEX MUSIC</div>
      <div id="search-row"><input id="search" class="inset" placeholder="Artist, album, or track…" autocomplete="off" /><button id="clear-search" class="metal-button" title="Clear search">×</button></div>
      <div class="panel-label">ARTIST INDEX</div>
      <div id="artists"></div>
    </aside>
    <main id="main">
      <div id="viewbar"><span id="view-title">BROWSE ARTISTS</span><span id="view-meta"></span></div>
      <div id="content"><div class="empty">Select an artist or search Plex music.</div></div>
      <div id="status">Booting…</div>
    </main>
  </div>
<script src="search-tree.js"></script>
<script src="library.js"></script>
</body>
</html>
